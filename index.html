<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>熊洋洋｜个人作品集</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0d0d0d;
            color: #ffffff;
            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;
        }

        /* =========================
           顶部导航
        ========================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            padding: 25px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            z-index: 100;

            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.5),
                transparent
            );
        }

        .logo {
            font-size: 18px;
            letter-spacing: 4px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;

            margin-left: 30px;

            font-size: 14px;

            transition: 0.3s;
        }

        nav a:hover {
            opacity: 0.5;
        }


        /* =========================
           首页
        ========================= */

        .hero {
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .hero h1 {
            font-size: 70px;
            font-weight: 400;

            letter-spacing: 12px;

            margin-bottom: 25px;
        }

        .hero p {
            color: #999999;

            font-size: 18px;

            letter-spacing: 5px;

            margin-bottom: 50px;
        }

        .enter {
            display: inline-block;

            padding: 15px 45px;

            border: 1px solid #777777;

            color: #ffffff;

            text-decoration: none;

            font-size: 15px;

            transition: 0.3s;
        }

        .enter:hover {
            background: #ffffff;
            color: #000000;
        }


        /* =========================
           通用区域
        ========================= */

        section {
            padding: 120px 8%;
        }

        .section-title {
            font-size: 38px;

            font-weight: 400;

            letter-spacing: 6px;

            margin-bottom: 60px;
        }


        /* =========================
           视频作品
        ========================= */

        .works {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 25px;
        }

        .work {
            height: 360px;

            background: #1a1a1a;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #777777;

            transition: 0.4s;
        }

        .work:hover {
            transform: scale(1.02);

            background: #222222;

            color: #ffffff;
        }

        .work span {
            font-size: 18px;

            letter-spacing: 3px;
        }


        /* =========================
           照片
        ========================= */

        .photos {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 15px;
        }

        .photo {
            height: 300px;

            background: #1a1a1a;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #777777;

            transition: 0.4s;
        }

        .photo:hover {
            transform: scale(1.02);

            background: #222222;

            color: #ffffff;
        }


        /* =========================
           关于我
        ========================= */

        .about {
            max-width: 800px;
        }

        .about p {
            color: #aaaaaa;

            font-size: 17px;

            line-height: 2.2;
        }


        /* =========================
           联系方式
        ========================= */

        .contact p {
            color: #aaaaaa;

            font-size: 16px;

            line-height: 2.5;
        }


        /* =========================
           页脚
        ========================= */

        footer {
            padding: 50px 20px;

            text-align: center;

            color: #555555;

            font-size: 13px;
        }


        /* =========================
           手机适配
        ========================= */

        @media (max-width: 700px) {

            nav {
                padding: 20px;
            }

            nav a {
                margin-left: 10px;

                font-size: 12px;
            }

            .logo {
                font-size: 14px;
            }

            .hero h1 {
                font-size: 44px;

                letter-spacing: 7px;
            }

            .hero p {
                font-size: 15px;

                letter-spacing: 4px;
            }

            section {
                padding: 80px 20px;
            }

            .section-title {
                font-size: 28px;
            }

            .works {
                grid-template-columns: 1fr;
            }

            .photos {
                grid-template-columns: 1fr;
            }

            .work {
                height: 250px;
            }

            .photo {
                height: 300px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================

        </div>

    <!-- =========================

    <section id="about">

        <h2 class="section-title">

        </h2>


        <div class="about">

            <p>

                一名摄像师和影像创作者。

                <br><br>

                不断学习和提升自己的影像表达能力。

            </p>

        </div>

    </section>


    <!-- =========================

    ========================= -->

    <section id="contact">

        <h2 class="section-title">
            联系我
        </h2>


        <div class="contact">

            <p>

                微信：17152156883

                <br>

                邮箱：2050137537@qq.com

                <br>

                如果有拍摄需求，欢迎联系我。

            </p>

        </div>

    </section>


    <!-- =========================
         页脚
    ========================= -->

    <footer>

        © 2026 熊洋洋 · 个人影像作品集

    </footer>


</body>

</html>
